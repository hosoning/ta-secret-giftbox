<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="TA 的秘密礼盒 —— 面向梦女的数字拆礼物沉浸式互动。象征性礼物与私人留言，本地收藏，无需注册。" />
  <meta name="theme-color" content="#0c1410" />
  <title>TA 的秘密礼盒</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 封面 -->
  <section id="screen-cover" class="screen active">
    <div class="logo-area">
      <div class="gift-box-visual">
        <div class="box">
          <div class="lid"></div>
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="bow">🎀</div>
        </div>
      </div>
      <h1 class="cover-title">TA 的秘密礼盒</h1>
      <p class="cover-subtitle">拆开 TA 为你准备的小惊喜</p>
    </div>
    <div class="cover-actions">
      <button class="btn btn-primary" id="btn-start">开始拆礼</button>
      <button class="btn btn-ghost" id="btn-to-collection">礼物陈列室</button>
    </div>
    <p class="disclaimer">
      本站为数字象征性互动体验，所有礼物均为虚拟内容，不涉及真实物品寄送或消费。
    </p>
  </section>

  <!-- 填写名字 -->
  <section id="screen-names" class="screen">
    <h2 class="section-title">写下你们的名字</h2>
    <p class="section-desc">可以随时修改，仅保存在本设备</p>
    <div class="form-card">
      <div class="input-group">
        <label for="input-user-name">你的名字</label>
        <input type="text" id="input-user-name" placeholder="例如：小明" maxlength="12" autocomplete="off" />
      </div>
      <div class="input-group">
        <label for="input-ta-name">TA 的名字</label>
        <input type="text" id="input-ta-name" placeholder="例如：角色名" maxlength="12" autocomplete="off" />
      </div>
    </div>
    <button class="btn btn-primary" id="btn-names-next" style="width:100%">下一步</button>
    <button class="btn btn-text" id="btn-names-back" style="margin-top:12px;width:100%">返回</button>
  </section>

  <!-- 选择心情 -->
  <section id="screen-mood" class="screen">
    <h2 class="section-title">今天的心情是？</h2>
    <p class="section-desc">TA 会根据你的状态准备礼物</p>
    <div class="mood-grid" id="mood-grid"></div>
    <button class="btn btn-primary" id="btn-mood-next" style="width:100%" disabled>拆开礼盒</button>
    <button class="btn btn-text" id="btn-mood-back" style="margin-top:12px;width:100%">返回修改名字</button>
  </section>

  <!-- 拆礼动画 -->
  <section id="screen-unbox" class="screen">
    <div class="unbox-stage" id="unbox-stage">
      <div class="unbox-box" id="unbox-box">
        <div class="lid"></div>
        <div class="ribbon"></div>
      </div>
      <div class="unbox-gift-icon" id="unbox-gift-icon">🎁</div>
    </div>
    <p id="unbox-hint" style="color:var(--text-muted);font-size:14px;">点击礼盒拆开</p>
    <p class="skip-hint" id="skip-hint" style="display:none">点击任意处跳过</p>
  </section>

  <!-- 礼物揭示 -->
  <section id="screen-reveal" class="screen">
    <div class="reveal-layers" id="reveal-layers">
      <div class="layer layer-gift" id="layer-gift">
        <span class="gift-icon-large" id="reveal-icon">🎁</span>
        <div class="gift-name" id="reveal-name">礼物名称</div>
        <div class="gift-theme" id="reveal-theme"></div>
      </div>
      <div class="layer layer-card" id="layer-card">
        <div class="card-title" id="reveal-card-title">卡片标题</div>
        <div class="card-message" id="reveal-message">留言内容</div>
      </div>
      <div class="layer layer-note" id="layer-note" style="display:none">
        <div class="note-label">附上的小纸条</div>
        <div class="note-text" id="reveal-note"></div>
      </div>
    </div>
    <div class="reveal-meta" id="reveal-meta"></div>
    <div class="reveal-actions">
      <div class="row">
        <button class="btn btn-ghost" id="btn-favorite">♡ 收藏</button>
        <button class="btn btn-ghost" id="btn-share">生成分享图</button>
      </div>
      <button class="btn btn-primary" id="btn-again" style="width:100%">再拆一盒</button>
      <button class="btn btn-text" id="btn-to-collection-from-reveal" style="width:100%">进入礼物陈列室</button>
    </div>
  </section>

  <!-- 陈列室 -->
  <section id="screen-collection" class="screen">
    <div class="collection-header">
      <h2>礼物陈列室</h2>
      <button class="btn btn-text" id="btn-collection-back">返回</button>
    </div>
    <div class="collection-tools">
      <input type="search" class="search-box" id="search-input" placeholder="搜索礼物或留言…" />
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <span class="filter-tab active" data-filter="all">全部</span>
      <span class="filter-tab" data-filter="favorited">已收藏</span>
    </div>
    <div class="gift-list" id="gift-list"></div>
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">📦</div>
      <p>还没有收到过礼物</p>
      <p style="font-size:13px;margin-top:4px">去拆开第一盒吧</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px">
      <button class="btn btn-ghost" id="btn-export" style="padding:10px 16px;font-size:13px">导出备份</button>
      <button class="btn btn-ghost" id="btn-import" style="padding:10px 16px;font-size:13px">导入恢复</button>
      <button class="btn btn-danger" id="btn-clear-all" style="padding:10px 16px;font-size:13px">清空全部</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none" />
    <p class="storage-notice">
      礼物记录保存在本设备浏览器中。清除浏览器数据、使用无痕模式或更换设备可能导致丢失，请及时导出备份。
    </p>
  </section>

  <!-- 详情重看 -->
  <section id="screen-detail" class="screen">
    <div class="reveal-layers" id="detail-layers">
      <div class="layer layer-gift visible">
        <span class="gift-icon-large" id="detail-icon">🎁</span>
        <div class="gift-name" id="detail-name"></div>
        <div class="gift-theme" id="detail-theme"></div>
      </div>
      <div class="layer layer-card visible">
        <div class="card-title" id="detail-card-title"></div>
        <div class="card-message" id="detail-message"></div>
      </div>
      <div class="layer layer-note" id="detail-note-wrap" style="display:none">
        <div class="note-label">附上的小纸条</div>
        <div class="note-text" id="detail-note"></div>
      </div>
    </div>
    <div class="reveal-meta" id="detail-meta"></div>
    <div class="detail-actions">
      <button class="btn btn-ghost" id="btn-detail-fav">♡ 收藏</button>
      <button class="btn btn-ghost" id="btn-detail-share">生成分享图</button>
      <button class="btn btn-danger" id="btn-detail-delete">删除</button>
      <button class="btn btn-text" id="btn-detail-back">返回陈列室</button>
    </div>
  </section>

  <!-- 分享图弹层 -->
  <div class="share-modal" id="share-modal">
    <div class="share-content">
      <canvas id="share-canvas" width="600" height="800"></canvas>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px">长按图片保存，或点击下方下载</p>
      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" id="btn-download-share" style="flex:1">下载图片</button>
        <button class="btn btn-ghost" id="btn-close-share" style="flex:1">关闭</button>
      </div>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog">
      <h3 id="dialog-title">确认</h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" id="dialog-cancel">取消</button>
        <button class="btn btn-primary" id="dialog-confirm">确认</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
