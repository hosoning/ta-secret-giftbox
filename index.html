<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="TA 的秘密礼盒 —— 面向梦女的数字拆礼物沉浸式互动。象征性礼物与私人留言，本地收藏，无需注册。" />
  <meta name="theme-color" content="#0c1410" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TA 的秘密礼盒" />
  <title>TA 的秘密礼盒</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部浮动按钮：音效开关 -->
  <button type="button" class="sound-toggle" id="btn-sound" aria-pressed="true" aria-label="拆礼音效：开" title="拆礼音效"></button>

  <main id="app">
  <!-- 封面 -->
  <section id="screen-cover" class="screen active" aria-labelledby="cover-title">
    <div class="logo-area">
      <div class="gift-box-visual" aria-hidden="true">
        <div class="sparkles"><i></i><i></i><i></i><i></i></div>
        <div class="box">
          <div class="lid"></div>
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="bow">
            <svg viewBox="0 0 64 36"><path d="M32 18C24 6 8 2 6 10s10 12 26 8z" /><path d="M32 18C40 6 56 2 58 10s-10 12-26 8z" /><path d="M30 19l-6 15 5-2 3 4 1-17zM34 19l6 15-5-2-3 4-1-17z" class="tail" /><ellipse cx="32" cy="18" rx="5" ry="4.5" class="knot" /></svg>
          </div>
        </div>
      </div>
      <h1 class="cover-title" id="cover-title" tabindex="-1">TA 的秘密礼盒</h1>
      <p class="cover-subtitle">拆开 TA 为你准备的小惊喜</p>
    </div>
    <div class="cover-actions">
      <button type="button" class="btn btn-primary" id="btn-start">开始拆礼</button>
      <button type="button" class="btn btn-ghost" id="btn-to-collection">礼物陈列室<span class="count-badge hidden" id="cover-count"></span></button>
      <button type="button" class="btn btn-text hidden" id="btn-install">添加到手机桌面</button>
    </div>
    <p class="disclaimer">
      本站为数字象征性互动体验，所有礼物均为虚拟内容，不涉及真实物品寄送或消费。
    </p>
  </section>

  <!-- 填写名字 -->
  <section id="screen-names" class="screen" aria-labelledby="names-title">
    <h2 class="section-title" id="names-title" tabindex="-1">写下你们的名字</h2>
    <p class="section-desc">可以随时修改，仅保存在本设备</p>
    <div class="form-card">
      <div class="input-group">
        <label for="input-user-name">你的名字</label>
        <input type="text" id="input-user-name" placeholder="例如：小明" maxlength="12" autocomplete="off" enterkeyhint="next" />
      </div>
      <div class="input-group">
        <label for="input-ta-name">TA 的名字</label>
        <input type="text" id="input-ta-name" placeholder="例如：角色名" maxlength="12" autocomplete="off" enterkeyhint="done" />
      </div>
    </div>
    <button type="button" class="btn btn-primary btn-block" id="btn-names-next">下一步</button>
    <button type="button" class="btn btn-text btn-block mt-12" id="btn-names-back">返回</button>
  </section>

  <!-- 选择心情 -->
  <section id="screen-mood" class="screen" aria-labelledby="mood-title">
    <h2 class="section-title" id="mood-title" tabindex="-1">今天的心情是？</h2>
    <p class="section-desc" id="mood-desc">TA 会根据你的状态准备礼物</p>
    <div class="mood-grid" id="mood-grid" role="radiogroup" aria-labelledby="mood-title"></div>
    <button type="button" class="btn btn-primary btn-block" id="btn-mood-next" disabled>拆开礼盒</button>
    <button type="button" class="btn btn-text btn-block mt-12" id="btn-mood-back">返回修改名字</button>
  </section>

  <!-- 拆礼动画 -->
  <section id="screen-unbox" class="screen" aria-labelledby="unbox-title">
    <h2 class="sr-only" id="unbox-title" tabindex="-1">拆礼物</h2>
    <button type="button" class="btn-skip" id="btn-skip">跳过动画</button>
    <p class="unbox-from" id="unbox-from"></p>
    <button type="button" class="unbox-stage" id="unbox-stage" aria-label="点击礼盒拆开">
      <span class="unbox-glow" aria-hidden="true"></span>
      <span class="unbox-burst" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="unbox-box" id="unbox-box" aria-hidden="true">
        <span class="lid"><span class="ribbon-lid"></span></span>
        <span class="ribbon"></span>
        <span class="ribbon-h"></span>
        <span class="bow">
          <svg viewBox="0 0 64 36"><path d="M32 18C24 6 8 2 6 10s10 12 26 8z" /><path d="M32 18C40 6 56 2 58 10s-10 12-26 8z" /><ellipse cx="32" cy="18" rx="5" ry="4.5" class="knot" /></svg>
        </span>
      </span>
      <span class="unbox-gift-icon" id="unbox-gift-icon" aria-hidden="true"></span>
    </button>
    <p class="unbox-hint" id="unbox-hint" aria-live="polite">点击礼盒拆开</p>
  </section>

  <!-- 礼物揭示 -->
  <section id="screen-reveal" class="screen" aria-labelledby="reveal-name">
    <div class="reveal-layers" id="reveal-layers">
      <div class="layer layer-gift" id="layer-gift">
        <span class="gift-icon-large" id="reveal-icon"></span>
        <h2 class="gift-name" id="reveal-name" tabindex="-1">礼物名称</h2>
        <div class="gift-theme" id="reveal-theme"></div>
      </div>
      <div class="layer layer-card" id="layer-card">
        <div class="card-title" id="reveal-card-title">卡片标题</div>
        <div class="card-message" id="reveal-message">留言内容</div>
      </div>
      <div class="layer layer-note" id="layer-note" hidden>
        <div class="note-label">附上的小纸条</div>
        <div class="note-text" id="reveal-note"></div>
      </div>
    </div>
    <div class="reveal-meta" id="reveal-meta"></div>
    <div class="reveal-actions">
      <div class="row">
        <button type="button" class="btn btn-ghost" id="btn-favorite" aria-pressed="false"></button>
        <button type="button" class="btn btn-ghost" id="btn-share"></button>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="btn-again">再拆一盒</button>
      <button type="button" class="btn btn-text btn-block" id="btn-to-collection-from-reveal">进入礼物陈列室</button>
    </div>
  </section>

  <!-- 陈列室 -->
  <section id="screen-collection" class="screen" aria-labelledby="collection-title">
    <div class="collection-header">
      <button type="button" class="icon-btn" id="btn-collection-back" aria-label="返回"></button>
      <h2 id="collection-title" tabindex="-1">礼物陈列室</h2>
      <span class="collection-count" id="collection-count"></span>
    </div>
    <div class="collection-tools">
      <label class="search-wrap">
        <span class="sr-only">搜索礼物或留言</span>
        <span class="search-icon" id="search-icon"></span>
        <input type="search" class="search-box" id="search-input" placeholder="搜索礼物、留言或心情…" enterkeyhint="search" />
      </label>
    </div>
    <div class="filter-tabs" id="filter-tabs" role="group" aria-label="筛选"></div>
    <div class="gift-list" id="gift-list" aria-live="polite"></div>
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon" id="empty-icon"></div>
      <p id="empty-title">还没有收到过礼物</p>
      <p class="empty-sub" id="empty-sub">去拆开第一盒吧</p>
      <button type="button" class="btn btn-ghost mt-12" id="btn-empty-start">开始拆礼</button>
    </div>
    <div class="collection-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="btn-export"></button>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-import"></button>
      <button type="button" class="btn btn-danger btn-sm" id="btn-clear-all"></button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden />
    <p class="storage-notice">
      礼物记录保存在本设备浏览器中。清除浏览器数据、使用无痕模式或更换设备可能导致丢失，请及时导出备份。<br>
      所有礼物均为数字象征性内容，不涉及真实物品寄送。
    </p>
  </section>

  <!-- 详情重看 -->
  <section id="screen-detail" class="screen" aria-labelledby="detail-name">
    <div class="collection-header">
      <button type="button" class="icon-btn" id="btn-detail-top-back" aria-label="返回陈列室"></button>
    </div>
    <div class="reveal-layers" id="detail-layers">
      <div class="layer layer-gift visible">
        <span class="gift-icon-large" id="detail-icon"></span>
        <h2 class="gift-name" id="detail-name" tabindex="-1"></h2>
        <div class="gift-theme" id="detail-theme"></div>
      </div>
      <div class="layer layer-card visible">
        <div class="card-title" id="detail-card-title"></div>
        <div class="card-message" id="detail-message"></div>
      </div>
      <div class="layer layer-note visible" id="detail-note-wrap" hidden>
        <div class="note-label">附上的小纸条</div>
        <div class="note-text" id="detail-note"></div>
      </div>
    </div>
    <div class="reveal-meta" id="detail-meta"></div>
    <div class="reveal-actions">
      <div class="row">
        <button type="button" class="btn btn-ghost" id="btn-detail-fav" aria-pressed="false"></button>
        <button type="button" class="btn btn-ghost" id="btn-detail-share"></button>
      </div>
      <button type="button" class="btn btn-danger btn-block" id="btn-detail-delete"></button>
      <button type="button" class="btn btn-text btn-block" id="btn-detail-back">返回陈列室</button>
    </div>
  </section>
  </main>

  <!-- 分享图弹层 -->
  <div class="share-modal" id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
    <div class="share-content">
      <h3 class="share-title" id="share-title">分享图</h3>
      <div class="share-preview" id="share-preview"><div class="share-loading">正在生成…</div></div>
      <p class="share-tip">手机可长按图片保存到相册</p>
      <div class="share-buttons">
        <button type="button" class="btn btn-primary" id="btn-download-share">保存图片</button>
        <button type="button" class="btn btn-ghost hidden" id="btn-native-share">分享</button>
      </div>
      <button type="button" class="btn btn-text btn-block" id="btn-close-share">关闭</button>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="dialog-overlay" id="dialog-overlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h3 id="dialog-title">确认</h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="dialog-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="dialog-confirm">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请开启 JavaScript 以使用本站。</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
